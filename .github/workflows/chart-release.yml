name: chart-release

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "charts/br-rust-common-chart/Chart.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_DIR: charts/br-rust-common-chart
  OCI_REPO: oci://ghcr.io/botresources/charts
  TAG_PREFIX: chart/br-rust-common-chart/v

jobs:
  resolve:
    name: resolve the chart version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.chart.outputs.name }}
      version: ${{ steps.chart.outputs.version }}
    steps:
      - name: refuse a branch that does not publish
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "::error::charts are published from main or release/** only, not from ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: read name and version from Chart.yaml
        id: chart
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source .github/scripts/chart-release-lib.sh
          name="$(yq '.name' "${CHART_DIR}/Chart.yaml")"
          version="$(yq '.version' "${CHART_DIR}/Chart.yaml")"
          if ! [[ "$version" =~ $CHART_SEMVER_RE ]]; then
            echo "::error file=${CHART_DIR}/Chart.yaml::version '${version}' is not a release version (X.Y.Z or X.Y.Z-<pre-release>)"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  release:
    name: publish ${{ needs.resolve.outputs.name }} ${{ needs.resolve.outputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    concurrency:
      group: chart-release-${{ needs.resolve.outputs.name }}-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: tool versions
        run: helm version --short && yq --version

      - name: decide — push, tag only, nothing, or refuse
        id: decide
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source .github/scripts/chart-release-lib.sh
          refuse() { echo "::error::$*"; exit 1; }

          tag="${TAG_PREFIX}${VERSION}"
          work="${RUNNER_TEMP}/chart"
          mkdir -p "${work}/local" "${work}/published"
          helm package "$CHART_DIR" --destination "${work}/local" >/dev/null
          package="${work}/local/${NAME}-${VERSION}.tgz"

          tag_state="$(chart_tag_state origin "$tag")" || refuse "$tag_state"
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT
          helm registry login ghcr.io --username "${ACTOR}" --password-stdin <<<"${TOKEN}"
          registry_state="$(chart_registry_state "$OCI_REPO" "$NAME" "$VERSION")" || refuse "$registry_state"
          content=""
          if [ "$registry_state" = present ]; then
            helm pull "${OCI_REPO}/${NAME}" --version "$VERSION" --destination "${work}/published" >/dev/null
            content="$(chart_packages_match "${work}/published/${NAME}-${VERSION}.tgz" "$package")" || refuse "$content"
          fi
          echo "tag ${tag}: ${tag_state}; ${OCI_REPO}/${NAME}:${VERSION}: ${registry_state}${content:+ (content: ${content})}"

          decision="$(chart_publish_decision "$tag_state" "$registry_state" "$content")" ||
            refuse "${NAME} ${VERSION}: ${decision}"
          case "$decision" in
            noop) echo "::notice::${NAME} ${VERSION} is released (${tag}) and the published package matches this commit: nothing to do." ;;
            tag) echo "::notice::${NAME} ${VERSION} is on the registry with this commit's content but not tagged (a previous run failed after the push): tagging only." ;;
            push) echo "Will publish ${NAME} ${VERSION} and tag it ${tag}." ;;
          esac
          {
            echo "decision=${decision}"
            echo "tag=${tag}"
            echo "package=${package}"
          } >>"$GITHUB_OUTPUT"

      - name: chart gate
        if: steps.decide.outputs.decision != 'noop'
        run: bash .github/scripts/check-chart.sh

      - name: helm push
        if: steps.decide.outputs.decision == 'push'
        env:
          PACKAGE: ${{ steps.decide.outputs.package }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT
          helm registry login ghcr.io --username "${ACTOR}" --password-stdin <<<"${TOKEN}"
          helm push "$PACKAGE" "$OCI_REPO"

      - name: tag the release
        if: steps.decide.outputs.decision == 'push' || steps.decide.outputs.decision == 'tag'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "chart ${NAME} ${VERSION}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
