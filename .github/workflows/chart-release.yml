# chart-release — publish the br-common-service library chart.
#
# charts/br-common-service/ is released on its own version line, independent of
# the crates' workspace version that release-tags.yml tags. The PR gate
# (ci.yml, job `chart`) refuses a change under the chart unless its `version`
# is greater than the base's and not yet tagged, so every chart change reaches
# a release branch through a Chart.yaml change; workflow_dispatch retries a
# failed run.
#
# Branches: `main`, and `release/**` for a maintenance line (e.g. 1.0.x while
# main is on 2.x). A version is published once, whichever branch gets there
# first; a later run for the same version compares, and fails unless the
# published package is exactly this commit's.
#
# Order — the tag marks a shipped artifact, never a promise:
#   1. resolve the chart name and version (job `resolve`);
#   2. under a concurrency group per chart + version, log in, package this
#      commit, and read the tag chart/br-common-service/v<version> and the
#      registry. Each lookup must answer present or absent: a failed lookup
#      fails the run, it is never read as "absent". When the registry holds
#      the version, pull it and compare it with this commit's package;
#   3. decide (chart_publish_decision in .github/scripts/chart-release-lib.sh,
#      tested by test-chart-release.sh):
#        tag + package, same content       nothing to do;
#        package, same content, no tag     tag only (a run pushed, then failed);
#        neither                           push, then tag;
#        different content, or a tag with
#        no package behind it              FAIL — bump the version, or
#                                          investigate the stray tag;
#   4. re-run .github/scripts/check-chart.sh, so what ships is what the gate
#      rendered;
#   5. helm push the package of step 2 to oci://ghcr.io/botresources/charts;
#   6. tag chart/br-common-service/v<version>, never forced.
# A published version is never pushed again and a tag is never moved. Nothing
# is ever tagged `latest`, on the registry or in git. A failure before step 6
# leaves nothing mislabelled; the next run resumes from the decision.
#
# The chart/br-common-service/v* tag does not match release-tags.yml's
# `v<X.Y.Z>` workspace tags nor the semver job's baseline glob, and a
# chart-only push carries no Cargo version bump, so no crate is re-released.

name: chart-release

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "charts/br-common-service/Chart.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_DIR: charts/br-common-service
  OCI_REPO: oci://ghcr.io/botresources/charts
  TAG_PREFIX: chart/br-common-service/v

jobs:
  resolve:
    name: resolve the chart version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.chart.outputs.name }}
      version: ${{ steps.chart.outputs.version }}
    steps:
      - name: refuse a branch that does not publish
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "::error::charts are published from main or release/** only, not from ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: read name and version from Chart.yaml
        id: chart
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source .github/scripts/chart-release-lib.sh
          name="$(yq '.name' "${CHART_DIR}/Chart.yaml")"
          version="$(yq '.version' "${CHART_DIR}/Chart.yaml")"
          if ! [[ "$version" =~ $CHART_SEMVER_RE ]]; then
            echo "::error file=${CHART_DIR}/Chart.yaml::version '${version}' is not a release version (X.Y.Z or X.Y.Z-<pre-release>)"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  release:
    name: publish ${{ needs.resolve.outputs.name }} ${{ needs.resolve.outputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    # One run at a time per chart and version: two pushes of the same version
    # (main and a release branch, or a retry) never race on the push or the tag.
    concurrency:
      group: chart-release-${{ needs.resolve.outputs.name }}-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write # the chart/br-common-service/v<version> tag
      packages: write # helm push to ghcr.io/botresources/charts
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # the gate diffs against origin/main and reads tags

      # helm and yq ship in the runner image (the repository's action
      # allowlist has no helm installer).
      - name: tool versions
        run: helm version --short && yq --version

      # Before any registry read: the lookup must see what the publisher sees.
      - name: helm registry login
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "${ACTOR}" --password-stdin <<<"${TOKEN}"

      - name: decide — push, tag only, nothing, or refuse
        id: decide
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source .github/scripts/chart-release-lib.sh
          refuse() { echo "::error::$*"; exit 1; }

          tag="${TAG_PREFIX}${VERSION}"
          work="${RUNNER_TEMP}/chart"
          mkdir -p "${work}/local" "${work}/published"
          helm package "$CHART_DIR" --destination "${work}/local" >/dev/null
          package="${work}/local/${NAME}-${VERSION}.tgz"

          tag_state="$(chart_tag_state origin "$tag")" || refuse "$tag_state"
          registry_state="$(chart_registry_state "$OCI_REPO" "$NAME" "$VERSION")" || refuse "$registry_state"
          content=""
          if [ "$registry_state" = present ]; then
            helm pull "${OCI_REPO}/${NAME}" --version "$VERSION" --destination "${work}/published" >/dev/null
            content="$(chart_packages_match "${work}/published/${NAME}-${VERSION}.tgz" "$package")" || refuse "$content"
          fi
          echo "tag ${tag}: ${tag_state}; ${OCI_REPO}/${NAME}:${VERSION}: ${registry_state}${content:+ (content: ${content})}"

          decision="$(chart_publish_decision "$tag_state" "$registry_state" "$content")" ||
            refuse "${NAME} ${VERSION}: ${decision}"
          case "$decision" in
            noop) echo "::notice::${NAME} ${VERSION} is released (${tag}) and the published package matches this commit: nothing to do." ;;
            tag) echo "::notice::${NAME} ${VERSION} is on the registry with this commit's content but not tagged (a previous run failed after the push): tagging only." ;;
            push) echo "Will publish ${NAME} ${VERSION} and tag it ${tag}." ;;
          esac
          {
            echo "decision=${decision}"
            echo "tag=${tag}"
            echo "package=${package}"
          } >>"$GITHUB_OUTPUT"

      - name: chart gate
        if: steps.decide.outputs.decision != 'noop'
        run: bash .github/scripts/check-chart.sh

      - name: helm push
        if: steps.decide.outputs.decision == 'push'
        env:
          PACKAGE: ${{ steps.decide.outputs.package }}
        run: helm push "$PACKAGE" "$OCI_REPO"

      - name: tag the release
        if: steps.decide.outputs.decision == 'push' || steps.decide.outputs.decision == 'tag'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "chart ${NAME} ${VERSION}"
          git push origin "refs/tags/${TAG}"
