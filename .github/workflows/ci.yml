      - name: cargo test (live projector tests)
        run: cargo test -p br-util-directory --all-features --locked -- --ignored --test-threads=1
      - name: stop NATS
        if: always()
        run: docker rm -f nats-jetstream || true

  coverage:
    name: coverage (per-crate, UT vs UT+E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov
      - name: start NATS JetStream broker
        run: |
          docker run -d --name nats-jetstream \
            -p 4222:4222 -p 8222:8222 \
            nats:2.14.1-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null 2>&1; then
              echo "NATS ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "NATS failed to become healthy within 30s" >&2
          docker logs nats-jetstream >&2
          exit 1
      - name: clean coverage profile
        run: cargo llvm-cov clean --workspace
      - name: instrument + run unit tests (no report)
        run: cargo llvm-cov --workspace --locked --no-report
      - name: snapshot UT-only report
        run: cargo llvm-cov report --json --output-path coverage-ut.json
      - name: instrument + run e2e tests (accumulating)
        run: cargo llvm-cov --workspace --locked --no-clean -- --ignored --test-threads=1 --skip full_handshake_succeeds
      - name: snapshot UT+E2E report
        run: cargo llvm-cov report --json --output-path coverage-ut-e2e.json
      - name: generate lcov (UT+E2E)
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - name: per-crate summary (UT vs UT+E2E)
        run: bash .github/scripts/coverage-summary.sh coverage-ut.json coverage-ut-e2e.json >> "$GITHUB_STEP_SUMMARY"
      - name: upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
      - name: stop NATS
        if: always()
        run: docker rm -f nats-jetstream || true
