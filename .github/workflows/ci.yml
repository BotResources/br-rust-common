name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets --locked
      - name: cargo test (doctests)
        run: cargo test --workspace --doc --locked

  conformance-feature:
    name: br-core-values --all-features (conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: conformance-feature
      - name: cargo clippy (--all-features)
        run: cargo clippy -p br-core-values --all-features --all-targets --locked -- -D warnings
      - name: cargo test (--all-features)
        run: cargo test -p br-core-values --all-features --locked

  migrate-feature:
    name: br-util-postgres --all-features (migrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: migrate-feature
      - name: cargo clippy (--all-features)
        run: cargo clippy -p br-util-postgres --all-features --all-targets --locked -- -D warnings
      - name: cargo test (--all-features)
        run: cargo test -p br-util-postgres --all-features --locked

  msrv:
    name: MSRV 1.88 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv
      - run: cargo build --workspace --locked

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  unused-deps:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-machete
      - run: cargo machete

  semver:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: semver
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks (per-crate, unified baseline)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          baseline=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n1)
          if [ -z "$baseline" ]; then
            echo "::notice::no prior workspace tag (v*), skipping semver-checks (first unified release)"
            exit 0
          fi
          for toml in crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$toml")")
            if ! git cat-file -e "${baseline}:crates/${crate}/Cargo.toml" 2>/dev/null; then
              echo "::notice::${crate} did not exist at ${baseline}, skipping semver-checks (new crate)"
              continue
            fi
            echo "::group::${crate} vs ${baseline}"
            if ! cargo semver-checks -p "${crate}" --baseline-rev "${baseline}"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  changelog:
    name: changelog entry for the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: check changelog entry
        run: bash .github/scripts/check-changelog.sh
      - name: check README tag pins are fresh
        run: bash .github/scripts/check-readme-pins.sh

  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown

  e2e-postgres:
    name: e2e (br-util-postgres vs PG 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e-postgres
      - name: cargo test (live PG tests)
        run: cargo test -p br-util-postgres --all-features --locked -- --ignored --test-threads=1 --skip full_handshake_succeeds

  e2e-postgres-tls:
    name: e2e (br-util-postgres TLS handshake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e-postgres-tls
      - name: start TLS-enabled Postgres
        run: |
          set -euo pipefail
          certdir="$(mktemp -d)"
          openssl req -new -x509 -days 1 -nodes \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -out "$certdir/server.crt" -keyout "$certdir/server.key"
          chmod 600 "$certdir/server.key"
          sudo chown 70:70 "$certdir/server.crt" "$certdir/server.key"
          docker run -d --name pg-tls \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            -v "$certdir/server.crt:/etc/pg/server.crt:ro" \
            -v "$certdir/server.key:/etc/pg/server.key:ro" \
            postgres:16-alpine \
            -c ssl=on -c ssl_cert_file=/etc/pg/server.crt \
            -c ssl_key_file=/etc/pg/server.key
          for i in $(seq 1 30); do
            if docker exec pg-tls pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres (TLS) ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to become healthy within 30s" >&2
          docker logs pg-tls >&2
          exit 1
      - name: cargo test (TLS handshake)
        env:
          TEST_TLS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          cargo test -p br-util-postgres --locked -- --ignored --exact \
            pool::live_tls_tests::full_handshake_succeeds \
            | tee tls-handshake.log
          grep -qE '^test result: ok\. 1 passed' tls-handshake.log
      - name: stop Postgres
        if: always()
        run: docker rm -f pg-tls || true

  e2e-nats:
    name: e2e (br-util-nats-fabric vs NATS JetStream)
    runs-on: ubuntu-latest
    env:
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e-nats
      - name: start NATS JetStream broker
        run: |
          docker run -d --name nats-jetstream \
            -p 4222:4222 -p 8222:8222 \
            nats:2.14.1-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null 2>&1; then
              echo "NATS ready after ${i}s"
              exit 0
            fi
            sleep 1
