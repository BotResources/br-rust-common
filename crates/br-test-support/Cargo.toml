[package]
name = "br-test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Dev-only shared e2e test helpers (Postgres role/pool/name primitives and the NATS/Postgres environment readers) for the br-rust-common crates; consumed as a path dev-dependency, never a normal dependency"

[dependencies]
futures-util = { workspace = true }
postgres-protocol = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time"] }
url = { workspace = true }
uuid = { workspace = true }
