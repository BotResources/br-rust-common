[package]
name = "br-util-nats-fabric"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Project NATS Fabric API: the restricted, typed application-facing way to use NATS in BR services — fixed v1 integration grammar, fixed streams/buckets, no runtime provisioning, plus generic Published-Language KV mechanics"

[features]
outbox = ["dep:sqlx", "dep:metrics"]

[dependencies]
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "br-core-integration/v0.1.0", version = "0.1.0" }
br-core-events = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-events", tag = "br-core-events/v0.1.0", version = "0.1.0" }
async-nats = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true, features = ["uuid", "json"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
br-core-kernel = { workspace = true }
br-test-support = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true }

[[test]]
name = "outbox_relay_e2e"
required-features = ["outbox"]
