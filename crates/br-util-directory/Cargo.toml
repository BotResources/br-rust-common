[package]
name = "br-util-directory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Publisher + consumer kit for the identity Published Language over the NATS Fabric: reconcile/orphan-delete (publisher) and a KV->PG projector with consumer-owned extension-extract, copy filter, and consumption scope over known_users/known_groups/known_user_group/known_service_accounts (consumer)"

[features]
default = []
publisher = ["dep:async-trait"]
consumer = [
    "dep:br-util-postgres",
    "dep:sqlx",
    "dep:async-trait",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
br-core-directory = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-directory", tag = "br-core-directory/v0.1.0", version = "0.1.0" }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "br-util-nats-fabric/v0.1.0", version = "0.1.0" }
br-util-postgres = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-postgres", tag = "br-util-postgres/v0.1.0", version = "0.1.0", optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["uuid", "json"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
br-test-support = { workspace = true }
sqlx = { workspace = true, features = ["uuid", "json"] }
tokio = { workspace = true }
uuid = { workspace = true }
