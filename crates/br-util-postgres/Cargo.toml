[package]
name = "br-util-postgres"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Postgres helpers for BotResources services: pools, TLS validation, app roles, grants"

[features]
migrate = ["sqlx/migrate"]

[dependencies]
br-util-boot = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-boot", tag = "br-util-boot/v0.1.0", version = "0.1.0" }
postgres-protocol = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
br-test-support = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
