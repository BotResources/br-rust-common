# Per-environment values, as a deploying repository sets them (uat). The
# in-namespace names — the Postgres Service `pg-rw`, the NATS Service `nats`,
# the two DSN Secrets — are the deploying repository's own names for charter,
# so that ../diff-against-chart.sh compares like with like: short in-namespace
# names, no hostname, no credential. The pull secret is a neutral stand-in.
env: uat

image:
  tag: 0.5.3

imagePullSecrets:
  - name: registry-pull

replicaCount: 1

nats:
  url: nats://nats:4222

postgres:
  host: pg-rw
  port: 5432
  # The in-namespace Postgres Service speaks plaintext: trust exactly that host.
  trustedNetwork: true
  appSecretName: pg-charter-app-credentials
  ownerSecretName: pg-charter-owner-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
