# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Enforced in CI via the `cargo-deny check` job. Run locally with:
#   cargo install --locked cargo-deny
#   cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Crates can opt out of specific advisories here, with a comment explaining why.
ignore = [
    # Why: unmaintained-only advisory (no vulnerability) on chrono, which
    # br-core-events, br-core-integration, br-identity-app,
    # br-util-observability and br-util-scope-declaration depend on
    # directly (br-util-nats-fabric in its tests). br-core-events and
    # br-core-integration expose it in their public API (occurred_at,
    # issued_at), so this workspace moves first and every consumer follows.
    # No upstream fix exists as of 2026-11-17: the advisory covers every
    # version, the locked 0.4.44 included. Waived by ID, never by crate, so
    # chrono's next advisory, a vulnerability included, still fails this
    # check. Remove once this workspace and its consumers move to jiff,
    # tracked across every Rust repo in the epic
    # https://github.com/BotResources/botresources.ai-claude-workspace/issues/341
    # Review by 2027-02-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, every version affected, no fixed release; move to jiff; review by 2027-02-17" },
]

[licenses]
version = 2
# Permissive licenses we accept across the workspace and its transitive deps.
# Keep the list tight — every addition is a deliberate policy decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # webpki-roots ships Mozilla's CA bundle data under this Community Data
    # License Agreement. Permissive, attribution-only — pulled in via
    # async-nats → tokio-websockets, and via sqlx's rustls-webpki TLS
    # backend (br-util-postgres, since 0.6.1).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# When we add internal git deps (br-* from other repos), allowlist them here.
allow-git = []
